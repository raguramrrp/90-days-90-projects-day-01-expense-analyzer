[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-expense-intelligence"
version = "1.0.0"
description = "Personal Expense Intelligence & Spending Analyzer - Day 1 of 90 Days 90 Projects Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Raguram", email = "raguramrrp@gmail.com" }
]
keywords = [
    "personal-finance",
    "expense-tracker",
    "spending-analyzer",
    "streamlit",
    "pandas",
    "machine-learning",
    "anomaly-detection",
    "data-analytics",
    "fintech"
]
dependencies = [
    "streamlit>=1.35.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "plotly>=5.22.0,<6.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
